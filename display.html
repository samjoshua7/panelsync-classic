<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PanelSync Display</title>
  <link rel="icon" href="data:,">
  <style>
    /* CSS resets and layout */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      overflow: hidden;
      font-family: sans-serif;
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .media-layer {
      max-width: 100%;
      max-height: 100%;
      position: absolute;
      display: none;
    }

    .media-layer.active {
      display: block;
    }

    /* textPlayer styles */
    .text-player-class {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 5%;
      box-sizing: border-box;
      font-size: 6vw;
      font-weight: bold;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .text-player-class.active {
      display: flex !important;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .slide.active {
      opacity: 1;
      z-index: 2;
    }

    .slide.inactive {
      opacity: 0;
      z-index: 1;
    }

    #progressBar {
      position: fixed;
      bottom: 0;
      right: 0;
      height: 2px;
      background: white;
      width: 100%;
      z-index: 3000;
      transform-origin: right;
    }

    /* Bottom-right controls: fullscreen above watermark */
    #cornerControls {
      position: fixed;
      bottom: 15px;
      right: 15px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }
    /* Watermark Styles */
    #watermark {
      text-align: right;
      opacity: 0.9;
      pointer-events: none;
      transition: opacity 0.3s;
      background: rgba(60, 60, 60, 0.4);
      padding: 6px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    #watermark .small {
      font-size: 10px;
      margin-bottom: 0px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #watermark .main {
      font-size: 13px;
      font-weight: bold;
    }

    /* Fullscreen Button Styles */
    #fullscreenBtn {
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.3s;
      pointer-events: auto;
    }

    #fullscreenBtn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    #startupControlBar {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      -webkit-transform: translate(-50%, -50%);
      z-index: 10001;
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-width: 320px;
      max-width: 90vw;
    }

    .control-btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    #audioUnlockBtn {
      background: #4f46e5;
      color: #ffffff;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px 26px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      transition: background 0.2s, transform 0.2s;
    }

    #audioUnlockBtn:hover,
    #audioUnlockBtn:focus {
      background: #4338ca;
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    #expireCacheBtn {
      background: #334155;
      color: #f8fafc;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: background 0.2s, transform 0.2s;
    }

    #expireCacheBtn:hover,
    #expireCacheBtn:focus {
      background: #475569;
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    #cacheStatusMsg {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 8px;
      min-height: 1.2rem;
    }

    #debugOverlay {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      z-index: 10;
    }
  </style>
</head>

<body>
  <!-- Dept Selection Modal -->
  <div id="deptModalOverlay"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 9999; justify-content: center; align-items: center; font-family: sans-serif;">
    <div
      style="background: #1e293b; padding: 2.5rem; border-radius: 24px; width: 90%; max-width: 500px; text-align: center;">
      <h2 style="margin-top:0; color: white;">Select Department</h2>
      <div id="deptGrid"
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1rem; margin-top: 2rem;">
      </div>
    </div>
  </div>

  <div id="viewport">
    <!-- Background layer -->
    <div id="backgroundLayer"
      style="position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 1;">
    </div>

    <div id="slideA" class="slide inactive">
      <img id="imagePlayerA" class="media-layer" alt="Signage Content">
      <video id="videoPlayerA" class="media-layer" playsinline preload="auto"></video>
      <div id="textPlayerA" class="media-layer text-player-class"></div>
    </div>
    <div id="slideB" class="slide inactive">
      <img id="imagePlayerB" class="media-layer" alt="Signage Content">
      <video id="videoPlayerB" class="media-layer" playsinline preload="auto"></video>
      <div id="textPlayerB" class="media-layer text-player-class"></div>
    </div>
  </div>

  <!-- Background audio -->
  <audio id="backgroundAudio" loop style="display: none;"></audio>
  <div id="progressBar"></div>

  <!-- Features -->
  <div id="cornerControls">
    <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    <div id="watermark">
    <div class="small">Built by</div>
    <div class="main" id="dynamicName">Silver Jubilee Developers</div>
  </div>
  </div>

  <!-- Operator Control Bar -->
  <div id="startupControlBar">
    <div class="control-btn-row">
      <button id="audioUnlockBtn" onclick="unlockAudio()" tabindex="1">🔊 Enable Audio</button>
      <button id="expireCacheBtn" onclick="expireCache()" tabindex="2">🗑️ Expire Cache</button>
    </div>
    <div id="cacheStatusMsg">System Ready. Click 'Enable Audio' to start.</div>
  </div>

  <div id="debugOverlay">PanelSync Classic Display v2.0</div>

  <script src="media-cache.js"></script>
  <script>
    // ==========================================
    // LEGACY SMART TV COMPATIBILITY (ES5 ONLY)
    // ==========================================

    // Department support
    var urlParams = (function () {
      var params = {};
      var query = window.location.search.substring(1);
      if (query === '') return params;
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
      }
      return params;
    })();

    var currentDept = urlParams.dept;

    // ==========================================
    // LEGACY SMART TV INDEXEDDB CACHE (ES5 ONLY)
    // ==========================================
    var isPreloading = false;
    PanelMediaCache.onProgress = function (loaded, total) {
      var status = document.getElementById('cacheStatusMsg');
      if (status) status.textContent = 'Caching media: ' + (loaded / 1048576).toFixed(1) +
        (total ? ' / ' + (total / 1048576).toFixed(1) : '') + ' MB. First download only if persistence succeeds.';
    };
    function initIndexedDB(callback) { PanelMediaCache.open(callback); }
    function getPlayableMediaUrl(url, callback) { PanelMediaCache.acquire(url, callback); }
    function preloadAllMedia(items) {
      if (isPreloading || !items || !items.length) return;
      isPreloading = true;
      var index = 0, cached = 0, failed = 0;
      var status = document.getElementById('cacheStatusMsg');
      function next() {
        if (index >= items.length) {
          isPreloading = false;
          if (status) status.textContent = cached + ' persisted locally' +
            (failed ? ', ' + failed + ' not persisted (see cache diagnostics).' : '.');
          return;
        }
        var item = items[index++];
        if (!item || !item.url) { next(); return; }
        PanelMediaCache.warm(item.url, function (blob, persisted) {
          if (persisted) cached++; else failed++;
          setTimeout(next, 0);
        });
      }
      next();
    }
    function expireCache() {
      PanelMediaCache.clear(function (ok) {
        var status = document.getElementById('cacheStatusMsg');
        if (status) status.textContent = ok ? 'Cache cleared. Re-syncing...' :
          'Cache busy or unavailable; nothing cleared. Try again after downloads finish.';
        if (ok) { preloadAllMedia(mediaArray); fetchBackgrounds(); fetchMusic(); }
      });
    }

    function verifyDeptAndInit() {
      initIndexedDB(function (ready) {
        console.log("IndexedDB Cache ready:", ready);
        verifyDepartment();
      });
    }

    function verifyDepartment() {
      requestMetadata('https://civic-voice-530e3-default-rtdb.firebaseio.com/depts.json', function (data) {
        var allowed = Object.keys(data || {});
        if (currentDept && allowed.indexOf(currentDept) !== -1) { initDisplay(); return; }
        document.getElementById('viewport').style.display = 'none';
        document.getElementById('deptModalOverlay').style.display = 'flex';
        var grid = document.getElementById('deptGrid');
        grid.innerHTML = '';
        allowed.forEach(function (dept) {
          var button = document.createElement('button');
          button.style.cssText = 'padding:1rem;border-radius:12px;cursor:pointer;background:#4f46e5;color:white;border:none;font-weight:bold;text-transform:uppercase;';
          button.textContent = dept;
          button.onclick = function () { window.location.href = '?dept=' + encodeURIComponent(dept); };
          grid.appendChild(button);
        });
      });
    }

    var RTDB_URL = 'https://civic-voice-530e3-default-rtdb.firebaseio.com/dept/' + currentDept + '/media.json';
    var SETTINGS_URL = 'https://civic-voice-530e3-default-rtdb.firebaseio.com/dept/' + currentDept + '/settings.json';
    var BACKGROUNDS_URL = 'https://civic-voice-530e3-default-rtdb.firebaseio.com/dept/' + currentDept + '/background.json';
    var MUSIC_URL = 'https://civic-voice-530e3-default-rtdb.firebaseio.com/dept/' + currentDept + '/music.json';

    var mediaArray = [];
    var currentBackground = null;
    var currentMusicObj = null;
    var currentIndex = -1;
    var timer = null;
    // var nameList = ["II CSE C"];
    // var nameList = ["Sam Joshua", "Team PanelSync", "II CSE C"];
    // var nameList = ["Sam Joshua", "II CSE C", "Sam Joshua", "Ramakrishna", "Sam Joshua", "Vignesh"];
    var nameList = ["III CSE C", "Silver Jubilee Developers"];
    var nameIndex = 0;

    var transitionType = 'cut';
    var activeLayer = 'B';
    var currentTimer = null;
    var videoFallbackTimer = null;
    var videoPlayRequestId = 0;
    var currentBackground = null;
    var currentMusic = null;
    var audioElement = null;
    var audioUnlocked = false;

    var nameEl = document.getElementById('dynamicName');
    var fsBtn = document.getElementById('fullscreenBtn');
    var progressBar = document.getElementById('progressBar');

    function startProgressBar(durationSeconds) {
      if (!progressBar) return;
      progressBar.style.transition = 'none';
      progressBar.style.width = '100%';
      void progressBar.offsetWidth; // Force reflow
      if (durationSeconds > 0) {
        progressBar.style.transition = 'width ' + durationSeconds + 's linear';
        progressBar.style.width = '0%';
      }
    }

    function startVideoProgress(videoElement, storedDuration) {
      if (!progressBar || !videoElement) return;
      progressBar.style.transition = 'none';

      function getVideoDuration() {
        if (isFinite(videoElement.duration) && videoElement.duration > 0) {
          return videoElement.duration;
        }
        if (isFinite(storedDuration) && storedDuration > 0) {
          return storedDuration;
        }
        return 0;
      }


      function updateVideoProgress() {
        var videoDuration = getVideoDuration();
        if (videoDuration > 0) {
          var remainingPercent = 100 - ((videoElement.currentTime / videoDuration) * 100);
          if (remainingPercent < 0) remainingPercent = 0;
          if (remainingPercent > 100) remainingPercent = 100;
          progressBar.style.width = remainingPercent + '%';
        } else {
          progressBar.style.width = '100%';
        }
      }

      videoElement.ontimeupdate = updateVideoProgress;
      videoElement.ondurationchange = updateVideoProgress;
      updateVideoProgress();
    }

    function getLayer(layerName) {
      return {
        container: document.getElementById('slide' + layerName),
        imgEl: document.getElementById('imagePlayer' + layerName),
        vidEl: document.getElementById('videoPlayer' + layerName),
        textEl: document.getElementById('textPlayer' + layerName)
      };
    }

    var metadataRequests = {}, metadataEtags = {}, metadataRetry = {}, metadataSeen = {};
    var metadataStats = { responses: 0, notModified: 0, responseCharacters: 0, offlineReads: 0 };
    function requestMetadata(url, callback) {
      if (metadataRequests[url] || (metadataRetry[url] || 0) > Date.now()) return;
      function cached() {
        if (metadataSeen[url]) return;
        try {
          var saved = localStorage.getItem('panelsync-metadata:' + url);
          if (saved !== null) {
            metadataStats.offlineReads++;
            callback(JSON.parse(saved)); metadataSeen[url] = true;
          }
        } catch (e) { }
      }
      if (navigator.onLine === false) { cached(); return; }
      var xhr = new XMLHttpRequest(), finished = false;
      metadataRequests[url] = true;
      function failed() {
        if (finished) return; finished = true;
        delete metadataRequests[url];
        metadataRetry[url] = Date.now() + 30000;
        cached();
      }
      try {
        xhr.open('GET', url, true);
        xhr.timeout = 15000;
        xhr.setRequestHeader('X-Firebase-ETag', 'true');
        if (metadataEtags[url]) xhr.setRequestHeader('If-None-Match', metadataEtags[url]);
        xhr.onload = function () {
          if (finished) return;
          if (xhr.status !== 200 && xhr.status !== 304) {
            // Permission failures must not be replaced with stale online data.
            if (xhr.status === 401 || xhr.status === 403) {
              finished = true; delete metadataRequests[url];
              metadataRetry[url] = Date.now() + 30000; return;
            }
            failed(); return;
          }
          finished = true; delete metadataRequests[url]; metadataRetry[url] = 0;
          var etag = xhr.getResponseHeader('ETag');
          if (etag) metadataEtags[url] = etag;
          if (xhr.status === 304) { metadataStats.notModified++; return; }
          try {
            var data = JSON.parse(xhr.responseText);
            metadataStats.responses++; metadataStats.responseCharacters += xhr.responseText.length;
            try { localStorage.setItem('panelsync-metadata:' + url, xhr.responseText); } catch (e) { }
            callback(data); metadataSeen[url] = true;
          } catch (e) { console.warn('Metadata could not be processed'); }
        };
        xhr.onerror = xhr.ontimeout = xhr.onabort = failed;
        xhr.send();
      } catch (e) { failed(); }
    }
    function fetchSettings() {
      requestMetadata(SETTINGS_URL, function (data) { transitionType = data && data.transition || 'cut'; });
    }
    function fetchMedia() {
      requestMetadata(RTDB_URL, function (data) {
        var next = [], key, item;
        data = data || {};
        for (key in data) {
          if (Object.prototype.hasOwnProperty.call(data, key)) {
            item = data[key];
            if (item && !item.disabled) next.push(item);
          }
        }
        next.sort(function (a, b) {
          return (parseInt(a.order, 10) || 0) - (parseInt(b.order, 10) || 0);
        });
        mediaArray = next;
        preloadAllMedia(mediaArray);
        if (currentIndex === -1 && mediaArray.length) nextSlide();
      });
    }
    function fetchBackgrounds() {
      requestMetadata(BACKGROUNDS_URL, function (data) { currentBackground = data; });
    }
    function fetchMusic() {
      requestMetadata(MUSIC_URL, function (data) { currentMusicObj = data; });
    }

    function nextSlide() {
      if (mediaArray.length === 0) {
        currentTimer = setTimeout(nextSlide, 5000);
        return;
      }

      currentIndex++;
      if (currentIndex >= mediaArray.length) {
        currentIndex = 0;
      }

      var item = mediaArray[currentIndex];
      console.log("Current slide:", currentIndex, item && item.type);

      if (!item || !item.type) {
        nextSlide();
        return;
      }

      playItem(item);
    }

    function setupLayer(layer, item) {
      layer.container._generation = (layer.container._generation || 0) + 1;
      layer.imgEl.classList.remove('active');
      layer.textEl.classList.remove('active');
      layer.vidEl.classList.remove('active');

      var playable = item._playableUrl || item.url;

      if (item.type === 'video') {
        layer.vidEl.src = playable;
        layer.vidEl.classList.add('active');
        layer.vidEl.muted = !audioUnlocked;
        layer.vidEl.style.backgroundColor = 'transparent';
      } else if (item.type === 'text') {
        layer.textEl.style.backgroundColor = item.bgColor || '#000000';
        layer.textEl.style.color = item.textColor || '#ffffff';
        layer.textEl.textContent = item.content;
        layer.textEl.classList.add('active');
      } else if (item.type === 'image') {
        layer.imgEl.src = playable;
        layer.imgEl.classList.add('active');
      }

      // Memory cleanup: track and revoke old layer blob url if needed
      if (layer.container._activeBlobUrl) {
        if (layer.container._activeBlobUrl.indexOf('blob:') === 0) {
          PanelMediaCache.release(layer.container._activeBlobUrl);
        }
        layer.container._activeBlobUrl = null;
      }
      if (playable && playable.indexOf('blob:') === 0) {
        layer.container._activeBlobUrl = playable;
      }

      // Handle background
      updateBackground(item);

      // Handle music
      updateMusic(item);
    }

    var backgroundRequest = 0, musicRequest = 0;
    var backgroundSource = null, backgroundPlayable = null;
    var musicSource = null, musicPlayable = null;
    function updateBackground(item) {
      var request = ++backgroundRequest;
      var bgLayer = document.getElementById('backgroundLayer');
      if (item.useBackground && currentBackground && currentBackground.url) {
        var source = currentBackground.url;
        if (backgroundSource === source && backgroundPlayable) {
          bgLayer.style.display = 'block'; return;
        }
        getPlayableMediaUrl(source, function (bgPlayableUrl) {
          if (request !== backgroundRequest) { PanelMediaCache.release(bgPlayableUrl); return; }
          var previous = backgroundPlayable;
          backgroundSource = source; backgroundPlayable = bgPlayableUrl;
          bgLayer.style.backgroundImage = 'url("' + bgPlayableUrl + '")';
          bgLayer.style.display = 'block';
          if (previous) PanelMediaCache.release(previous);
        });
      } else {
        bgLayer.style.display = 'none';
        bgLayer.style.backgroundImage = '';
        if (backgroundPlayable) PanelMediaCache.release(backgroundPlayable);
        backgroundSource = backgroundPlayable = null;
      }
    }

    function updateMusic(item) {
      var request = ++musicRequest;
      if (!audioElement) {
        audioElement = document.getElementById('backgroundAudio');
      }

      if (item.useMusic && currentMusicObj && currentMusicObj.url) {
        var source = currentMusicObj.url;
        function readyMusic(musicPlayableUrl) {
          if (request !== musicRequest) { PanelMediaCache.release(musicPlayableUrl); return; }
          if (audioElement.src !== musicPlayableUrl) {
            audioElement.src = musicPlayableUrl;
          }
          if (musicPlayable !== musicPlayableUrl) {
            if (musicPlayable) PanelMediaCache.release(musicPlayable);
            musicPlayable = musicPlayableUrl;
          }
          musicSource = source;

          if (audioUnlocked) {
            var playPromise = audioElement.play();
            if (playPromise !== undefined) {
              playPromise.catch(function (e) {
                console.warn("Audio play failed:", e);
                var ctrlBar = document.getElementById('startupControlBar');
                if (ctrlBar && !audioUnlocked) {
                  ctrlBar.style.display = 'block';
                }
                audioUnlocked = false;
              });
            }
          } else {
            var ctrlBar = document.getElementById('startupControlBar');
            if (ctrlBar && !audioUnlocked) {
              ctrlBar.style.display = 'block';
            }
          }
        }
        if (musicSource === source && musicPlayable) readyMusic(musicPlayable);
        else getPlayableMediaUrl(source, readyMusic);
      } else {
        audioElement.pause();
        audioElement.removeAttribute('src');
        audioElement.load();
        if (musicPlayable) PanelMediaCache.release(musicPlayable);
        musicSource = musicPlayable = null;
      }
    }

    function unlockAudio() {
      audioUnlocked = true;
      var ctrlBar = document.getElementById('startupControlBar');
      if (ctrlBar) {
        ctrlBar.style.display = 'none';
      }

      var activeLayerObj = getLayer(activeLayer);
      if (activeLayerObj.vidEl.classList.contains('active')) {
        activeLayerObj.vidEl.muted = false;
      }

      if (!audioElement) {
        audioElement = document.getElementById('backgroundAudio');
      }

      if (audioElement.src) {
        var playPromise = audioElement.play();
        if (playPromise !== undefined) {
          playPromise.catch(function (e) { console.warn("Audio play failed again:", e); });
        }
      }
    }

    function playItem(item) {
      var slideRequest = ++videoPlayRequestId;
      if (currentTimer) {
        clearTimeout(currentTimer);
        currentTimer = null;
      }
      if (videoFallbackTimer) {
        clearTimeout(videoFallbackTimer);
        videoFallbackTimer = null;
      }

      var nextLayerName = (activeLayer === 'A') ? 'B' : 'A';
      var nextLayer = getLayer(nextLayerName);
      var currentLayerObj = getLayer(activeLayer);

      var duration = 5;

      if (item.type === 'image') {
        duration = parseInt(item.duration, 10) || 5;
        getPlayableMediaUrl(item.url, function (playableUrl) {
          if (slideRequest !== videoPlayRequestId) { PanelMediaCache.release(playableUrl); return; }
          item._playableUrl = playableUrl;
          // 1. IMAGE PRELOADING (CRITICAL)
          var preload = new Image();
          preload.onload = function () {
            if (slideRequest !== videoPlayRequestId) { PanelMediaCache.release(playableUrl); return; }
            setupLayer(nextLayer, item);
            startSlide(nextLayerName, currentLayerObj, nextLayer, duration, false);
          };
          preload.onerror = function () {
            PanelMediaCache.release(playableUrl);
            if (slideRequest !== videoPlayRequestId) return;
            console.warn("Failed to load image");
            nextSlide();
          };
          preload.src = playableUrl;
        });

      } else if (item.type === 'text') {
        duration = parseInt(item.duration, 10) || 10;
        setupLayer(nextLayer, item);
        startSlide(nextLayerName, currentLayerObj, nextLayer, duration, false);

      } else if (item.type === 'video') {
        var requestId = slideRequest;
        getPlayableMediaUrl(item.url, function (playableUrl) {
          if (requestId !== videoPlayRequestId) { PanelMediaCache.release(playableUrl); return; }

          var video = nextLayer.vidEl;
          var videoStarted = false;
          var videoFinished = false;
          var lastTime = -1, stalledSince = Date.now();
          function watchVideo() {
            if (videoFinished || requestId !== videoPlayRequestId) return;
            if (video.currentTime !== lastTime) { lastTime = video.currentTime; stalledSince = Date.now(); }
            if (Date.now() - stalledSince > 45000) {
              advanceFromVideo('Video made no playback progress for 45 seconds; skipping.'); return;
            }
            videoFallbackTimer = setTimeout(watchVideo, 1000);
          }

          function advanceFromVideo(reason) {
            if (videoFinished || requestId !== videoPlayRequestId) return;
            videoFinished = true;
            if (videoFallbackTimer) {
              clearTimeout(videoFallbackTimer);
              videoFallbackTimer = null;
            }
            if (reason) console.warn(reason);
            if (!videoStarted || activeLayer === nextLayerName) {
              nextSlide();
            }
          }

          function revealVideoWhenReady() {
            if (videoStarted || videoFinished || requestId !== videoPlayRequestId) return;
            videoStarted = true;
            var storedDuration = parseFloat(item.duration);
            var progressDuration = (isFinite(video.duration) && video.duration > 0)
              ? video.duration
              : ((isFinite(storedDuration) && storedDuration > 0) ? storedDuration : 0);
            startSlide(nextLayerName, currentLayerObj, nextLayer, progressDuration, true);
          }

          video.onloadedmetadata = null;
          video.onloadeddata = revealVideoWhenReady;
          video.oncanplay = revealVideoWhenReady;
          video.onplaying = revealVideoWhenReady;
          video.onended = function () {
            advanceFromVideo(null);
          };
          video.onerror = function () {
            var mediaError = video.error;
            advanceFromVideo('Video failed to load' + (mediaError ? ' (code ' + mediaError.code + ')' : ''));
          };

          item._playableUrl = playableUrl;
          setupLayer(nextLayer, item);
          video.load();
          videoFallbackTimer = setTimeout(watchVideo, 1000);

          var playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(function (error) {
              advanceFromVideo('Video playback failed: ' + (error && error.message ? error.message : error));
            });
          }

        });
      } else {
        nextSlide();
      }
    }

    // UNIFIED SLIDE CONTROLLER
    function startSlide(nextLayerName, currentLayer, nextLayer, duration, isVideo) {
      // 1. Handle transition
      if (transitionType === 'cut') {
        nextLayer.container.style.transition = 'none';
        currentLayer.container.style.transition = 'none';
      } else {
        nextLayer.container.style.transition = 'opacity 0.5s ease';
        currentLayer.container.style.transition = 'opacity 0.5s ease';
      }

      nextLayer.container.className = 'slide active';
      currentLayer.container.className = 'slide inactive';

      activeLayer = nextLayerName;

      // 2. Start progress bar EXACTLY when slide becomes visible
      if (isVideo) {
        startVideoProgress(nextLayer.vidEl, duration);
      } else {
        startProgressBar(duration);
      }

      // 3. Schedule next slide
      if (!isVideo) {
        currentTimer = setTimeout(nextSlide, duration * 1000);
      }

      // 4. Cleanup hidden container gracefully (no DOM clearing before fade)
      var cleanupGeneration = currentLayer.container._generation;
      setTimeout(function () {
        if (currentLayer.container._generation === cleanupGeneration && currentLayer.container.className.indexOf('inactive') !== -1) {
          if (currentLayer.vidEl) {
            currentLayer.vidEl.pause();
            currentLayer.vidEl.ontimeupdate = null;
            currentLayer.vidEl.ondurationchange = null;
            currentLayer.vidEl.onloadedmetadata = null;
            currentLayer.vidEl.onloadeddata = null;
            currentLayer.vidEl.oncanplay = null;
            currentLayer.vidEl.onplaying = null;
            currentLayer.vidEl.onended = null;
            currentLayer.vidEl.onerror = null;
            currentLayer.vidEl.removeAttribute('src');
            currentLayer.vidEl.load();
          }
          if (currentLayer.imgEl) {
            currentLayer.imgEl.src = "";
          }
          // Memory cleanup: Revoke old slide's blob URL from TV RAM
          if (currentLayer.container._activeBlobUrl) {
            if (currentLayer.container._activeBlobUrl.indexOf('blob:') === 0) {
              PanelMediaCache.release(currentLayer.container._activeBlobUrl);
            }
            currentLayer.container._activeBlobUrl = null;
          }
        }
      }, 600);
    }

    // Fullscreen Logic
    function toggleFullscreen() {
      var doc = window.document;
      var docEl = doc.documentElement;

      var requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      var cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) requestFullScreen.call(docEl);
      } else {
        if (cancelFullScreen) cancelFullScreen.call(doc);
      }
    }

    // Hide/show fullscreen button based on fullscreen state
    document.addEventListener('fullscreenchange', function () {
      var doc = window.document;
      if (doc.fullscreenElement) {
        fsBtn.style.display = 'none';
      } else {
        fsBtn.style.display = 'block';
      }
    });

    // Watermark Rotation
    function rotateNames() {
      nameIndex++;
      if (nameIndex >= nameList.length) nameIndex = 0;
      nameEl.textContent = nameList[nameIndex];
    }

    // UI Interactions removed for TV compatibility

    // Initialize
    function initDisplay() {
      fetchSettings();
      fetchMedia();
      fetchBackgrounds();
      fetchMusic();

      // Background sync every 10 seconds
      setInterval(function () {
        fetchSettings();
        fetchMedia();
        fetchBackgrounds();
        fetchMusic();
      }, 10000);

      // Watermark rotation every 5 seconds
      setInterval(rotateNames, 7000);

      // Auto-fullscreen trigger with delay
      setTimeout(function () {
        try {
          var doc = window.document;
          var docEl = doc.documentElement;
          var requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
          if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
            if (requestFullScreen) {
              var fsPromise = requestFullScreen.call(docEl);
              if (fsPromise !== undefined) {
                fsPromise.catch(function (e) {
                  console.warn("Initial FS blocked - needs user gesture");
                  fsBtn.style.display = 'block';
                });
              }
            }
          } else {
            fsBtn.style.display = 'none';
          }
        } catch (e) {
          console.warn("Initial FS blocked - needs user gesture");
          fsBtn.style.display = 'block';
        }
      }, 1500);
    }

    // Boot
    window.onload = verifyDeptAndInit;

  </script>
</body>
